
<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#09090d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Boost Hub">
  <title>Beyond the Binary Boost Hub</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.svg">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div id="app"></div>

  <button id="installAppBtn" style="
    position:fixed;top:12px;right:12px;z-index:99999;
    background:#d6a21d;color:#09090d;border:0;
    border-radius:10px;padding:12px 16px;
    font-weight:800;box-shadow:0 4px 15px #0003">
    Install App
  </button>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/app.js"></script>

  <script>
    let installPrompt = null;
    const installBtn = document.getElementById('installAppBtn');

    if (window.matchMedia('(display-mode: standalone)').matches ||
        window.navigator.standalone === true) {
      installBtn.style.display = 'none';
    }

    window.addEventListener('beforeinstallprompt', event => {
      event.preventDefault();
      installPrompt = event;
    });

    installBtn.addEventListener('click', async () => {
      if (installPrompt) {
        installPrompt.prompt();
        await installPrompt.userChoice;
        installPrompt = null;
        return;
      }

      if (/iphone|ipad|ipod/i.test(navigator.userAgent)) {
        alert('To install: tap Share in Safari, then choose Add to Home Screen.');
      } else {
        alert('Open this website in Chrome, then use the browser menu and choose Add to Home screen or Install app.');
      }
    });

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch(console.error);
      });
    }
  </script>
</body>
</html>
